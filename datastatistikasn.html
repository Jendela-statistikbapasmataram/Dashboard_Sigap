<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komposisi ASN - Statistik Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a0a 100%);
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Lapisan Canvas Latar Belakang */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Berada di paling belakang */
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .text-accent { color: #ff4d4d; }
        .bg-accent { background-color: #ff4d4d; }
        
        /* Efek Hover untuk kartu jabatan */
        .jabatan-card {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .jabatan-card:hover {
            transform: scale(1.1); /* Membesar */
            background: rgba(255, 255, 255, 0.15); /* Lebih terang */
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2); /* Menyala putih lembut */
            z-index: 20;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .jabatan-card.border-accent:hover {
            box-shadow: 0 0 30px rgba(32, 16, 16, 0.4); /* Menyala merah */
            border-color: #ff4d4d;
        }

        .jabatan-card:active {
            transform: scale(0.95);
        }
    </style> 
</head>
<body class="p-4 md:p-8">

    <!-- Canvas untuk animasi background -->
    <canvas id="bg-canvas"></canvas>

    <div class="max-w-6xl mx-auto space-y-6 relative z-10">
        <a href="index.html" class="inline-block text-gray-400 hover:text-white transition">
            &larr; Kembali ke Dashboard
        </a>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-8">
                    <h2 class="text-xl font-semibold opacity-80 uppercase tracking-wider">ASN BAPAS MATARAM</h2>
                    <p class="text-sm text-gray-400 mb-4">Update data 24 Agustus 2026</p>
                    <h1 class="text-5xl font-bold mb-8">68 PEGAWAI</h1>
                    
                    <div class="relative h-64 mb-6"> 
                        <canvas id="pusatDaerahChart"></canvas>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex justify-between items-center border-b border-white/10 pb-2">
                            <span>LAKI-LAKI</span>
                            <span class="font-bold text-blue-400">66%</span>
                        </div>
                        <div class="flex justify-between items-center border-b border-white/10 pb-2">
                            <span>PEREMPUAN</span>
                            <span class="font-bold text-pink-400">34%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                
                <div class="glass-card p-8">
                    <h2 class="text-3xl font-bold mb-6 italic">KOMPOSISI PENDIDIKAN <span class="text-accent">ASN</span></h2>
                    <div class="h-80">
                        <canvas id="pendidikanChart"></canvas>
                    </div>
                    <p class="text-[10px] text-gray-500 mt-4 italic text-right">Sumber: Data Bezzetting Pegawai Agustus 2026</p>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-card jabatan-card p-4 text-center" onclick="window.location.href='kepala.html'"> 
                        <div class="w-16 h-16 mx-auto mb-2"><canvas id="ring1"></canvas></div>
                        <p class="text-[10px] uppercase text-gray-400">Kepala</p>
                        <p class="font-bold">1 </p>
                    </div> 

                    <div class="glass-card jabatan-card p-4 text-center border-b-4 border-accent" onclick="window.location.href='struktural.html'"> 
                        <div class="w-16 h-16 mx-auto mb-2"><canvas id="ring2"></canvas></div>
                        <p class="text-[10px] uppercase text-gray-400">Struktural </p>
                        <p class="font-bold text-accent">12 </p>
                    </div> 

                    <div class="glass-card jabatan-card p-4 text-center" onclick="window.location.href='jftteknis.html'">
                        <div class="w-16 h-16 mx-auto mb-2"><canvas id="ring3"></canvas></div>
                        <p class="text-[10px] uppercase text-gray-400">JFT / Teknis </p>
                        <p class="font-bold">34 </p>
                    </div>

                    <div class="glass-card jabatan-card p-4 text-center" onclick="window.location.href='jfupelaksana.html'">
                        <div class="w-16 h-16 mx-auto mb-2"><canvas id="ring4"></canvas></div>
                        <p class="text-[10px] uppercase text-gray-400">JFU / Pelaksana</p>
                        <p class="font-bold">21</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card p-8 w-full">
            <h2 class="text-2xl font-bold mb-4 uppercase tracking-wide">TREN JUMLAH PEGAWAI <span class="text-accent">(5 TAHUN TERAKHIR)</span></h2>
            <div class="h-72">
                <canvas id="trenPegawaiChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ANIMASI BACKGROUND (PARTIKEL SALJU PUTIH TERANG)
        // ==========================================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        // Membuat 60 partikel salju agar terlihat lebih hidup namun tetap elegan
        const maxParticles = 60; 

        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 3 + 1,        // Ukuran bervariasi (1px - 4px)
                density: Math.random() * maxParticles, // Digunakan untuk efek ayunan horizontal
                vy: Math.random() * 0.7 + 0.2,        // Kecepatan jatuh ke bawah
                alpha: Math.random() * 0.6 + 0.4      // Opacity putih terang (0.4 - 1.0)
            });
        }

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                // Menggerakkan partikel ke bawah
                p.y += p.vy;
                
                // Menambahkan efek ayunan ke kanan/kiri (wobble) agar seperti salju asli
                p.density += 0.01;
                p.x += Math.sin(p.density) * 0.2;

                // Jika salju keluar dari bawah layar, reset kembali ke atas
                if (p.y > height) {
                    p.x = Math.random() * width;
                    p.y = -10;
                    p.vy = Math.random() * 0.7 + 0.2;
                }
                
                // Jika salju keluar dari batas kanan/kiri, reset posisinya
                if (p.x > width) p.x = 0;
                else if (p.x < 0) p.x = width;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                
                // Menggunakan warna putih terang murni dengan opasitas masing-masing partikel
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });

            requestAnimationFrame(animateBg);
        }
        animateBg();


        // ==========================================
        // CONFIG CHART.JS (BAWAAN)
        // ==========================================
        Chart.defaults.color = '#888';

        // 1. Chart Pusat vs Daerah (Pie)
        new Chart(document.getElementById('pusatDaerahChart'), {
            type: 'pie',
            data: {
                labels: ['Laki-Laki', 'Perempuan'],
                datasets: [{
                    data: [45,23],
                    backgroundColor: ['#ff4d4d', '#ffffff'],
                    borderWidth: 0
                }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });

        // 2. Chart Pendidikan (Bar)
        new Chart(document.getElementById('pendidikanChart'), {
            type: 'bar',
            data: {
                labels: ['SMA','D-III', 'D-IV', 'S-1', 'S-2', 'S-3'],
                datasets: [{
                    label: 'Jumlah ASN',
                    data: [15,1,1,47,4,0],
                    backgroundColor: '#ff4d4d',
                    borderRadius: 4
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } } }
            }
        });

        // 3. Mini Rings (Doughnut) Helper Function
        function createRing(id, val, color = '#ff4d4d') {
            new Chart(document.getElementById(id), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [val, 100-val],
                        backgroundColor: [color, 'rgba(255,255,255,0.1)'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '70%', plugins: { tooltip: {enabled: false}, legend: {display: false} } }
            });
        }

        createRing('ring1', 1, '#ffffff');
        createRing('ring2', 12, '#ff4d4d');
        createRing('ring3', 34, '#ffffff');
        createRing('ring4', 20, '#ffffff');

        // 4. Tren Jumlah Pegawai (Line Chart)
        new Chart(document.getElementById('trenPegawaiChart'), {
            type: 'line',
            data: {
                labels: ['2022', '2023', '2024', '2025', '2026'],
                datasets: [{
                    label: 'Total Pegawai',
                    data: [54, 52, 61, 62, 68],
                    borderColor: '#00ff66',
                    backgroundColor: 'rgba(0, 255, 102, 0.1)',
                    fill: true,
                    tension: 0.3,
                    borderWidth: 3,
                    pointBackgroundColor: '#ffffff',
                    pointHoverRadius: 7
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    </script>
</body>
</html>
